name: CI

# Los checks que la página del proyecto declara: "ningún análisis avanza sin
# superar los checks". Acá se ejecutan de verdad, en cada push y PR.
#
# No usa `npm test` a propósito: ese script apunta al python del venv con ruta de
# Windows (.venv\Scripts\python.exe). En un runner Linux los comandos van
# directo, que es más explícito y no depende de cómo se armó el entorno local.
#
# Ningún paso necesita credenciales de Google Cloud: validan lógica, contrato y
# estructura. El refresh real contra BigQuery se corre a mano (ver CONTRIBUTING).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests y contrato de datos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      # Ejecuta index.html como el navegador, con un stub de Chart.js que
      # reproduce su restricción real: no se puede crear un segundo gráfico
      # sobre el mismo canvas. Verifica que los gráficos tengan datos reales.
      #
      # El glob va SIN comillas a propósito: así lo expande el shell. Node 20 no
      # soporta globs dentro de `--test` (llegaron en Node 21), y con comillas el
      # runner recibía la cadena literal y fallaba.
      - name: Tests del dashboard
        run: node --test tests/frontend/*.test.mjs

      - name: Tests del pipeline
        run: python -m pytest tests/ -q

      # Valida que data.json tenga las claves y campos que app.js lee.
      # Si esto falla, hay un gráfico o un KPI que no se va a llenar.
      - name: Contrato de data.json
        run: python scripts/refresh_data.py --check

      # El comparador es estático: cohortes.json es su única fuente. Si no trae
      # las métricas, los ejes o la tabla de puntaje que comparador.js lee, la
      # página no compara nada. Mismo mecanismo que el contrato de data.json.
      - name: Contrato de cohortes.json
        run: python scripts/cohortes.py --check

      # Cada query exportable debe declarar su @data-key, sin duplicados, y
      # cubrir todo lo que el frontend consume.
      - name: Marcadores del SQL
        run: python scripts/check_sql_keys.py

      # El libreto documenta el copy del sitio. Sin este check serian dos
      # fuentes de verdad del mismo texto: la pagina por un lado, el libreto
      # por otro, y se desincronizan en silencio.
      - name: El libreto coincide con la pagina
        run: python scripts/check_libreto.py

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Checks ejecutados"
            echo ""
            echo "| Check | Qué prueba |"
            echo "|---|---|"
            echo "| Dashboard | ejecuta \`index.html\` en un sandbox con Chart.js stubbeado: 10 gráficos con datos reales, filtro temporal, KPIs |"
            echo "| Comparador | ejecuta \`comparador.html\`: cohorte, percentil, banda por n chico y que sin datos no muestre nada |"
            echo "| Pipeline | parseo del SQL, formas de datos y contrato con el frontend |"
            echo "| Contrato de \`data.json\` | que existan las claves y campos que lee \`app.js\` |"
            echo "| Contrato de \`cohortes.json\` | que existan las métricas, ejes y tabla de puntaje que lee \`comparador.js\` |"
            echo "| Marcadores del SQL | \`@data-key\` sin duplicados, cubriendo lo que consume el frontend |"
            echo "| Libreto vs pagina | cada bloque de copy del libreto aparece en \`index.html\`, en orden |"
          } >> "$GITHUB_STEP_SUMMARY"
